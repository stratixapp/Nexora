<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — NEXORA</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/account.css">
</head>
<body>
<div class="nexora-loader" id="nexoraLoader"><span>N</span></div>
<div class="intro-bg"><div class="orb o1"></div><div class="orb o2"></div><div class="grain"></div></div>
<header><a class="logo" href="index.html">NEXORA<span>.</span></a><a class="skip" href="index.html">Explore</a></header>
<main>
<section class="visual"><div class="card back"></div><div class="card mid"></div><div class="card front"><div class="fashion-shape"></div><span>N / 01</span></div></section>
<section class="welcome">
<p class="eyebrow">WELCOME TO NEXORA</p>
<h1>Everything you<br><em>need, today.</em></h1>
<p class="lead">Browse and order via WhatsApp any time — <strong>no account needed to buy</strong>. Sign in only if you'd like to save your delivery address for next time.</p>
<div class="login-card">
  <button type="button" id="googleSignIn" class="google-btn"><svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.95v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.95A9 9 0 0 0 0 9c0 1.45.35 2.83.95 4.05l3.02-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .95 4.95l3.02 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>Continue with Google</button>
  <div class="or-divider"><span>or sign in with email</span></div>
  <div class="login-tabs"><button class="tab active" data-mode="login">Sign in</button><button class="tab" data-mode="signup">Create account</button></div>
  <form id="accountForm">
    <div id="signupFields" class="signup-fields" style="display:none">
      <div class="two"><label>Full name<input name="full_name" placeholder="Your name"></label><label>Age<input name="age" type="number" min="13" max="120" placeholder="25"></label></div>
      <label>Gender<select name="gender"><option value="">Select</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Prefer not to say</option></select></label>
      <label>Place / City<input name="place" placeholder="Kochi"></label>
      <label>Landmark<input name="landmark" placeholder="Near a known landmark"></label>
      <label>Street / Address<input name="address" placeholder="House / street / area"></label>
      <label>Phone<input name="phone" type="tel" placeholder="9XXXXXXXXX"></label>
    </div>
    <label>Email<input name="email" type="email" placeholder="you@gmail.com" required></label>
    <label>Password<input name="password" type="password" minlength="6" placeholder="••••••••" required></label>
    <button class="primary wide" id="submitBtn" type="submit">Sign in <span>→</span></button>
    <p id="formMsg" style="font-size:11px;color:#b3455e;margin-top:10px"></p>
  </form>
  <p class="switch" id="switchText">New to NEXORA? <button type="button" id="switchBtn">Create an account</button></p>
</div>
<a class="explore" href="index.html"><span class="explore-badge">Free to explore</span> Skip login &amp; browse NEXORA →</a>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/account.js"></script>
</body></html>
