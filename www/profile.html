<main style="max-width:560px;margin:0 auto;padding:50px 6vw 90px">
  <p class="eyebrow">ACCOUNT SETTINGS</p>
  <h1 style="font-family:'Playfair Display',serif;font-weight:500;font-size:38px;margin:4px 0 30px">My Profile</h1>
  <form id="profileForm" class="admin-card" style="max-width:none">
    <div class="two"><label>Full name<input name="full_name"></label><label>Age<input name="age" type="number" min="13" max="120"></label></div>
    <label>Gender<select name="gender"><option value="">Select</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Prefer not to say</option></select></label>
    <label>Email<input name="email" type="email" disabled style="opacity:.6"></label>
    <label>Phone<input name="phone" type="tel"></label>
    <label>Place / City<input name="place"></label>
    <label>Landmark<input name="landmark"></label>
    <label>Street / Address<input name="address"></label>
    <button class="primary wide" type="submit">Save changes</button>
    <p id="formMsg" style="font-size:11px;margin-top:12px"></p>
  </form>
  <button class="danger" id="signOutBtn" style="margin-top:20px">Sign out</button>
