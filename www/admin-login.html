<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin sign in — NEXORA</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1618">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
</head>
<body style="display:block;min-height:100vh;background:var(--bg)">
<div style="max-width:420px;margin:9vh auto;padding:0 20px">
  <a class="logo" href="index.html" style="font-size:22px">NEXORA<span>.</span></a>
  <p class="eyebrow" style="margin-top:30px">ADMIN ACCESS</p>
  <h1 style="font-size:34px;margin:0 0 8px">Admin sign in</h1>
  <p style="color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 25px">This area is restricted to store administrators. Your account must be created and marked as admin in Supabase first — see SETUP.md.</p>
  <form id="loginForm" class="admin-card" style="max-width:none">
    <label>Email<input name="email" type="email" required placeholder="admin@nexora.com"></label>
    <label>Password<input name="password" type="password" required minlength="6" placeholder="••••••••"></label>
    <button class="primary wide" type="submit">Sign in <span>→</span></button>
    <p id="formMsg" style="font-size:11px;color:#b3455e;margin-top:12px"></p>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/admin-auth.js"></script>
</body></html>
